version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: xpto-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xpto_financial
      MYSQL_USER: xpto
      MYSQL_PASSWORD: xpto123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
